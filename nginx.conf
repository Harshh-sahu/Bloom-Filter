events {
  worker_connections 1024;
}

http {
  # Required for Grafana websocket live dashboards
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # Spring Boot app — served at root
    location / {
      proxy_pass         http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Grafana — served at /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH=true in compose)
    location /grafana/ {
      proxy_pass         http://grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
    }

    # Prometheus — served at /prometheus/ (--web.route-prefix=/prometheus in compose)
    location /prometheus/ {
      proxy_pass         http://prometheus:9090;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }
  }
}
