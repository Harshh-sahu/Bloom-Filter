AWSTemplateFormatVersion: '2010-09-09'
Description: Bloom Filter EC2 deployment stack

Parameters:
  BuildNumber:
    Type: String
    Description: Docker image build number to deploy
  GhcrToken:
    Type: String
    NoEcho: true
    Description: GitHub PAT (read:packages) to pull the image on EC2
  GhcrUsername:
    Type: String
    Description: GitHub username (owner of the GHCR image)

Resources:

  BloomSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bloom Filter - allow app + SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: App access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH debug access

  BloomEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      # Latest Amazon Linux 2023 — always resolves to current AMI for the region
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64}}'
      SecurityGroups:
        - !Ref BloomSG
      Tags:
        - Key: Name
          Value: !Sub bloom-filter-build-${BuildNumber}
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -e
            exec > /var/log/bloom-deploy.log 2>&1

            echo "=== Starting Bloom Filter deployment (build ${BuildNumber}) ==="

            # Install Docker
            yum update -y
            yum install -y docker
            systemctl start docker
            systemctl enable docker
            usermod -aG docker ec2-user

            # Install Docker Compose plugin
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

            # Login to GHCR to pull private image
            echo "${GhcrToken}" | docker login ghcr.io -u ${GhcrUsername} --password-stdin

            # Download production docker-compose from the repo
            mkdir -p /app && cd /app
            curl -fsSL https://raw.githubusercontent.com/${GhcrUsername}/Bloom-Filter/main/docker-compose.prod.yml \
              -o docker-compose.yml

            # Start the app — BUILD_NUMBER is injected so docker-compose picks the right image tag
            BUILD_NUMBER="${BuildNumber}" docker compose up -d

            echo "=== Deployment done: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):8080 ==="

Outputs:
  AppUrl:
    Description: Application URL
    Value: !Sub "http://${BloomEC2.PublicIp}:8080"
  PublicIp:
    Description: EC2 Public IP
    Value: !GetAtt BloomEC2.PublicIp
  DeployedBuild:
    Description: Build number running on this instance
    Value: !Ref BuildNumber
