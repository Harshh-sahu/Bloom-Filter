version: 2

updates:
  # Maven dependencies
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      testcontainers:
        patterns: [ "org.testcontainers:*" ]

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
