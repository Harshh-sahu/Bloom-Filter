name: Commit Check

# ── Job graph ─────────────────────────────────────────────────────────────────
#
#   🔍 Determine Range ──► ✅ Validate Format
#
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:

jobs:

  # ── 1. Work out which commits to check ──────────────────────────────────────
  determine-range:
    name: "🔍 Determine Range"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      range: ${{ steps.range.outputs.range }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          fi
          echo "range=${RANGE}" >> $GITHUB_OUTPUT
          echo "Commit range: ${RANGE}"

  # ── 2. Validate that at least one commit matches HARSH-XXX ──────────────────
  validate-format:
    name: "✅ Validate Format"
    runs-on: ubuntu-latest
    needs: determine-range

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HARSH-XXX format
        run: |
          PATTERN='^HARSH-[0-9]+ .+'
          RANGE="${{ needs.determine-range.outputs.range }}"
          FOUND=0

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            echo "$msg" | grep -qE '^Merge (pull request|branch)' && continue

            if echo "$msg" | grep -qE "$PATTERN"; then
              echo "✅  $msg"
              FOUND=1
            else
              echo "·   $msg"
            fi
          done < <(git log --format="%s" $RANGE 2>/dev/null || git log --format="%s" -1)

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ❌ No commit follows the required format."
            echo ""
            echo "  At least one commit must match:"
            echo "    HARSH-{number} {description}"
            echo ""
            echo "  Examples:"
            echo "    HARSH-001 Add bloom filter warmup on startup"
            echo "    HARSH-042 Fix CVE-2025-24813 in Tomcat"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo ""
          echo "✅ At least one valid HARSH-XXX commit found — check passed."
