name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to deploy  (copy from Build workflow output)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name bloom-filter-stack \
            --template-file infra/ec2-stack.yml \
            --parameter-overrides \
              BuildNumber=${{ github.event.inputs.build_number }} \
              GhcrToken=${{ secrets.GHCR_PAT }} \
              GhcrUsername=${{ github.repository_owner }} \
            --no-fail-on-empty-changeset

      - name: Get deployment info
        run: |
          APP_URL=$(aws cloudformation describe-stacks \
            --stack-name bloom-filter-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`AppUrl`].OutputValue' \
            --output text)

          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name bloom-filter-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`PublicIp`].OutputValue' \
            --output text)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ DEPLOYED TO AWS"
          echo ""
          echo "  BUILD NUMBER : ${{ github.event.inputs.build_number }}"
          echo "  APP URL      : ${APP_URL}"
          echo "  PUBLIC IP    : ${PUBLIC_IP}"
          echo ""
          echo "  ⏳ App takes ~60s to start after EC2 boots."
          echo "     Check logs: Actions → Deploy logs"
          echo ""
          echo "  💸 Remember to run Destroy workflow when done!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
