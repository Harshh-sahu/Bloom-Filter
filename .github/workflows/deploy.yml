name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy — pick from repo Tags (e.g. main-30b70b8)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name bloom-filter-stack \
            --template-file infra/ec2-stack.yml \
            --parameter-overrides \
              ImageTag=${{ github.event.inputs.tag }} \
              GhcrToken=${{ secrets.GHCR_PAT }} \
              GhcrUsername=${{ github.repository_owner }} \
            --no-fail-on-empty-changeset

      - name: Get deployment info
        run: |
          APP_URL=$(aws cloudformation describe-stacks \
            --stack-name bloom-filter-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`AppUrl`].OutputValue' \
            --output text)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Deployed — tag \`${{ github.event.inputs.tag }}\`

          | Field       | Value |
          |-------------|-------|
          | Tag         | \`${{ github.event.inputs.tag }}\` |
          | App URL     | ${APP_URL} |

          > ⏳ App takes ~60s to start after EC2 boots.

          > 💸 Run **Destroy AWS** workflow when you are done to avoid charges.
          EOF
