name: Deploy to AWS

on:
  workflow_dispatch:   # no inputs — select the tag from "Use workflow from" dropdown

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name bloom-filter-stack \
            --template-file infra/ec2-stack.yml \
            --parameter-overrides \
              ImageTag=${{ github.ref_name }} \
              GhcrToken=${{ secrets.GHCR_PAT }} \
              GhcrUsername=${{ github.repository_owner }} \
            --no-fail-on-empty-changeset

      - name: Get deployment info
        run: |
          APP_URL=$(aws cloudformation describe-stacks \
            --stack-name bloom-filter-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`AppUrl`].OutputValue' \
            --output text)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Deployed

          | Field        | Value |
          |--------------|-------|
          | Git tag      | \`${{ github.ref_name }}\` |
          | Deployed by  | \`${{ github.actor }}\` |
          | App URL      | ${APP_URL} |

          > ⏳ App takes ~60s to start after EC2 boots.
          > 💸 Run **Destroy AWS** when done to avoid charges.
          EOF
