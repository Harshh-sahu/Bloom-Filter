name: Deploy to Azure

on:
  workflow_dispatch:   # trigger from tag: Run workflow → Use workflow from → Tags

env:
  RESOURCE_GROUP: bloom-filter-rg
  VM_NAME: bloom-filter-vm
  LOCATION: eastus         # change to centralindia / southeastasia if preferred

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        run: |
          az login --service-principal \
            -u "${{ secrets.AZ_CLIENT_ID }}" \
            -p "${{ secrets.AZ_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZ_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZ_SUBSCRIPTION_ID }}"

      - name: Build cloud-init startup script
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          GHCR_USER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.ref_name }}"

          # Write cloud-init — runs on the VM at first boot to install Docker and start the app
          {
            echo "#cloud-config"
            echo "runcmd:"
            echo "  - apt-get update -y && apt-get install -y docker.io curl"
            echo "  - mkdir -p /usr/local/lib/docker/cli-plugins"
            echo "  - curl -fsSL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose"
            echo "  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose"
            echo "  - systemctl start docker && systemctl enable docker"
            echo "  - echo '${GHCR_TOKEN}' | docker login ghcr.io -u ${GHCR_USER} --password-stdin"
            echo "  - mkdir -p /app"
            echo "  - curl -fsSL https://raw.githubusercontent.com/${GHCR_USER}/Bloom-Filter/${IMAGE_TAG}/docker-compose.prod.yml -o /app/docker-compose.yml"
            echo "  - cd /app && IMAGE_TAG=${IMAGE_TAG} docker compose up -d"
          } > /tmp/cloud-init.yml

      - name: First deploy or in-place update
        run: |
          VM_EXISTS=$(az group exists --name ${{ env.RESOURCE_GROUP }})

          if [ "$VM_EXISTS" = "true" ]; then
            echo "VM already running — doing in-place update..."

            az vm run-command invoke \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.VM_NAME }} \
              --command-id RunShellScript \
              --scripts "
                cd /app
                IMAGE_TAG=${{ github.ref_name }} docker compose pull app
                IMAGE_TAG=${{ github.ref_name }} docker compose up -d app
                echo 'Update complete: '${{ github.ref_name }}
              "

            echo "IN_PLACE=true" >> $GITHUB_ENV
          else
            echo "No existing deployment — creating fresh VM..."

            az group create \
              --name ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}

            az vm create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.VM_NAME }} \
              --image Ubuntu2204 \
              --size Standard_B2s \
              --admin-username azureuser \
              --generate-ssh-keys \
              --custom-data /tmp/cloud-init.yml

            az vm open-port --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.VM_NAME }} --port 8080 --priority 1001
            az vm open-port --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.VM_NAME }} --port 3000 --priority 1002
            az vm open-port --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.VM_NAME }} --port 9090 --priority 1003

            echo "IN_PLACE=false" >> $GITHUB_ENV
          fi

      - name: Print deployment info
        run: |
          PUBLIC_IP=$(az vm show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.VM_NAME }} \
            --show-details \
            --query publicIps \
            --output tsv)

          MODE=$([[ "$IN_PLACE" == "true" ]] && echo "🔄 In-place update (~30s)" || echo "🆕 Fresh VM (~90s)")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Deployed to Azure

          | Service    | URL |
          |------------|-----|
          | App        | http://${PUBLIC_IP}:8080 |
          | Grafana    | http://${PUBLIC_IP}:3000 |
          | Prometheus | http://${PUBLIC_IP}:9090 |

          | Field          | Value |
          |----------------|-------|
          | Git tag        | \`${{ github.ref_name }}\` |
          | Deployed by    | \`${{ github.actor }}\` |
          | Deploy mode    | ${MODE} |
          | Resource group | \`${{ env.RESOURCE_GROUP }}\` |

          > 💸 Run **Destroy Azure** workflow when done — deletes everything.
          EOF
