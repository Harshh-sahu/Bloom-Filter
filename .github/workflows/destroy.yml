name: Destroy Azure

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: bloom-filter-rg

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Check resource group exists
        id: check
        run: |
          EXISTS=$(az group exists --name ${{ env.RESOURCE_GROUP }})
          echo "exists=${EXISTS}" >> $GITHUB_OUTPUT

      - name: Delete resource group
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "Deleting ${{ env.RESOURCE_GROUP }} — VM, disk, NIC, NSG, public IP all removed..."
          az group delete \
            --name ${{ env.RESOURCE_GROUP }} \
            --yes

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Azure resources destroyed

          | Field          | Value |
          |----------------|-------|
          | Resource group | \`${{ env.RESOURCE_GROUP }}\` |
          | Deleted by     | \`${{ github.actor }}\` |

          All Azure resources deleted — no more charges.
          EOF

      - name: Nothing to destroy
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Resource group ${{ env.RESOURCE_GROUP }} not found — nothing to delete."
