name: Destroy AWS

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check stack exists
        id: check
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name bloom-filter-stack \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "Stack status: ${STATUS}"

      - name: Delete CloudFormation stack
        if: steps.check.outputs.status != 'DOES_NOT_EXIST'
        run: |
          echo "Deleting bloom-filter-stack..."
          aws cloudformation delete-stack --stack-name bloom-filter-stack
          aws cloudformation wait stack-delete-complete --stack-name bloom-filter-stack
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ DESTROYED — EC2 instance terminated"
          echo "  💰 No more AWS charges for this deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Nothing to destroy
        if: steps.check.outputs.status == 'DOES_NOT_EXIST'
        run: echo "Stack bloom-filter-stack does not exist — nothing to delete."
