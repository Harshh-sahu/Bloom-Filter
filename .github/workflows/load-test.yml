name: Load Test

# ── Job graph ─────────────────────────────────────────────────────────────────
#
#   🏗️ Build Application ──► ⚡ Run Load Test ──► 📊 Upload Results
#
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Virtual users'
        default: '100'
        required: false
      duration:
        description: 'Duration (e.g. 30s, 2m)'
        default: '30s'
        required: false
  schedule:
    - cron: '0 0 * * *'

jobs:

  # ── 1. Build the JAR and cache it ───────────────────────────────────────────
  build:
    name: "🏗️ Build Application"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn package -DskipTests -q

      - name: Cache JAR for load test job
        uses: actions/cache/save@v4
        with:
          path: target/*.jar
          key: jar-${{ github.sha }}

  # ── 2. Start app + run k6 ───────────────────────────────────────────────────
  load-test:
    name: "⚡ Run Load Test"
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bloomfilter
          POSTGRES_USER: bloomfilter
          POSTGRES_PASSWORD: bloomfilter
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore JAR
        uses: actions/cache/restore@v4
        with:
          path: target/*.jar
          key: jar-${{ github.sha }}

      - name: Start application
        run: |
          java -jar target/*.jar &
          echo "Waiting for app to be ready..."
          for i in {1..30}; do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Seed test data
        run: curl -sf -X POST "http://localhost:8080/api/v1/seed/generate?count=50000"

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6
        env:
          LOAD_VUS: ${{ github.event.inputs.vus || '100' }}
          LOAD_DURATION: ${{ github.event.inputs.duration || '30s' }}
        run: k6 run load-test/k6-script.js

  # ── 3. Upload results artifact ───────────────────────────────────────────────
  upload-results:
    name: "📊 Upload Results"
    runs-on: ubuntu-latest
    needs: load-test
    if: always()

    steps:
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: load-test/results.json
          if-no-files-found: warn
