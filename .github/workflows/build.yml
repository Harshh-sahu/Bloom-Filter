name: Build

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          # On a tag push: github.ref_name = "v1.0.0"
          # On manual dispatch: use the input
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "IMAGE=ghcr.io/${OWNER}/bloom-filter" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}"                     >> $GITHUB_ENV

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Build complete — tag \`${{ env.IMAGE_TAG }}\`

          | Field   | Value |
          |---------|-------|
          | Tag     | \`${{ env.IMAGE_TAG }}\` |
          | Image   | \`${{ env.IMAGE }}:${{ env.IMAGE_TAG }}\` |
          | Commit  | \`${{ github.sha }}\` |

          ### 👉 Deploy this build
          **Actions → Deploy to AWS → Run workflow → tag:** \`${{ env.IMAGE_TAG }}\`

          ### 🗑 Remove from AWS when done
          **Actions → Destroy AWS → Run workflow**
          EOF
