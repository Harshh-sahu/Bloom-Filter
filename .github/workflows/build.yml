name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

# ── Job dependency graph (each box in the GitHub UI) ──────────────────────────
#
#   prepare ──► compile ──► unit-tests     ─┐
#                       ──► integration-tests─┼──► docker-build ──► push
#                       ──► security-scan  ─┘
#
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Compute image tag (shared across all downstream jobs) ────────────────
  prepare:
    name: "📋 Prepare"
    runs-on: ubuntu-latest
    outputs:
      image:     ${{ steps.tag.outputs.image }}
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          TAG="${BRANCH}-${SHORT_SHA}"
          echo "image=ghcr.io/${OWNER}/bloom-filter" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                           >> $GITHUB_OUTPUT

  # ── 2. Compile ───────────────────────────────────────────────────────────────
  compile:
    name: "⚙️ Compile"
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -q

      # Cache compiled classes for downstream jobs
      - name: Cache target/
        uses: actions/cache/save@v4
        with:
          path: target/
          key: build-${{ github.sha }}

  # ── 3a. Unit tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore compiled classes
        uses: actions/cache/restore@v4
        with:
          path: target/
          key: build-${{ github.sha }}

      - name: Run unit tests
        run: mvn test -q

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/

  # ── 3b. Integration tests (Testcontainers — real Postgres + Redis) ───────────
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn verify -q -DskipUnitTests

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/

  # ── 3c. Security scan (Trivy — CVEs in dependencies) ────────────────────────
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Populate ~/.m2 before Trivy runs — prevents Trivy from fetching
      # dependencies itself and hitting Maven Central's rate limit (429).
      - name: Resolve Maven dependencies
        run: mvn dependency:resolve -q

      - name: Trivy dependency CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-dep-report.txt
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-dependency-report-${{ needs.prepare.outputs.image_tag }}
          path: trivy-dep-report.txt

  # ── 4. Docker build + image scan ────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build & Scan"
    runs-on: ubuntu-latest
    needs: [prepare, unit-tests, integration-tests, security-scan]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
          format: table
          output: trivy-image-report.txt
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-image-report-${{ needs.prepare.outputs.image_tag }}
          path: trivy-image-report.txt

  # ── 5. Push to GHCR + create Git tag ────────────────────────────────────────
  push:
    name: "🚀 Push to GHCR"
    runs-on: ubuntu-latest
    needs: [prepare, docker-build]
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.prepare.outputs.image_tag }}
          git push origin ${{ needs.prepare.outputs.image_tag }}

      - name: Job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Build \`${{ needs.prepare.outputs.image_tag }}\` complete

          | Stage | Status |
          |-------|--------|
          | Compile            | ✅ |
          | Unit Tests         | ✅ |
          | Integration Tests  | ✅ |
          | Security Scan      | ✅ |
          | Docker Build/Scan  | ✅ |
          | Push to GHCR       | ✅ |

          ### Image
          \`\`\`
          ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
          ${{ needs.prepare.outputs.image }}:latest
          \`\`\`
          EOF
