name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      build_number: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Set image vars
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo '${{ github.ref_name }}' | tr '[:upper:]/' '[:lower:]-')
          echo "IMAGE=ghcr.io/${OWNER}/bloom-filter"           >> $GITHUB_ENV
          echo "BRANCH_TAG=${BRANCH}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Build #${{ github.run_number }} complete

          | Field         | Value |
          |---------------|-------|
          | Build number  | \`${{ github.run_number }}\` |
          | Branch        | \`${{ github.ref_name }}\` |
          | Commit        | \`${{ github.sha }}\` |
          | Image (branch+build) | \`${{ env.IMAGE }}:${{ env.BRANCH_TAG }}\` |
          | Image (build only)   | \`${{ env.IMAGE }}:${{ github.run_number }}\` |
          | Image (latest)       | \`${{ env.IMAGE }}:latest\` |

          ### 👉 To deploy
          Go to **Actions → Deploy to AWS → Run workflow**
          Enter build number: **${{ github.run_number }}**
          EOF
