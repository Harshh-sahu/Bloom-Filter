name: Build

on:
  push:
    branches: ['**']   # every push on every branch

jobs:
  build:
    name: Build & Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          TAG="${BRANCH}-${SHORT_SHA}"
          echo "image=ghcr.io/${OWNER}/bloom-filter" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                           >> $GITHUB_OUTPUT
          echo "IMAGE=ghcr.io/${OWNER}/bloom-filter" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}"                     >> $GITHUB_ENV

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── Stage 1 · Compile ──────────────────────────────────────────────────
      - name: '[1/6] Compile'
        id: compile
        run: mvn compile -q

      # ── Stage 2 · Unit tests ───────────────────────────────────────────────
      - name: '[2/6] Unit tests'
        id: unit
        run: mvn test -q

      # ── Stage 3 · Integration tests (Testcontainers — real Postgres + Redis)
      - name: '[3/6] Integration tests'
        id: integration
        run: mvn verify -q -DskipUnitTests

      # ── Stage 4 · Trivy dependency scan (pom.xml + JARs → CVEs) ─────────────
      - name: '[4/6] Trivy dependency CVE scan'
        id: trivy_fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ── Stage 5 · Docker build + Trivy image scan ─────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '[5/6] Build Docker image (local — not pushed yet)'
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: '[5/6] Trivy image CVE scan'
        id: trivy_image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ── Stage 6 · Push — only reached if all 5 stages above passed ─────────
      - name: '[6/6] Push to GHCR'
        id: push
        run: |
          docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag  ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          passed() { [ "$1" = "success" ] && echo "✅ Pass" || echo "❌ Fail"; }
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Build \`${{ env.IMAGE_TAG }}\`

          | Stage | Result |
          |-------|--------|
          | Compile                       | $(passed '${{ steps.compile.outcome }}') |
          | Unit tests                    | $(passed '${{ steps.unit.outcome }}') |
          | Integration tests             | $(passed '${{ steps.integration.outcome }}') |
          | Trivy — dependency CVE scan   | $(passed '${{ steps.trivy_fs.outcome }}') |
          | Trivy — image CVE scan        | $(passed '${{ steps.trivy_image.outcome }}') |
          | Push to GHCR                  | $(passed '${{ steps.push.outcome }}') |

          ### Image tags
          \`\`\`
          ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}   ← use this to deploy
          ${{ env.IMAGE }}:latest
          \`\`\`

          ### Deploy this build
          **Actions → Deploy to AWS → Run workflow**
          Tag: \`${{ env.IMAGE_TAG }}\`
          EOF
